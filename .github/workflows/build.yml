name: build

on:
  push:
    branches: [ main, dev, certification ]
  pull_request:
    branches: [ main, dev, certification ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit
        continue-on-error: true
      - run: npm outdated
        continue-on-error: true
      - run: npm run eslint --if-present
      - run: npm run lint --if-present
      - run: npm run package
      - name: Run tests and fail on TypeScript bundling errors
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          # Strip ANSI escape sequences so grep works reliably with colored output.
          sed -E 's/\x1B\[[0-9;]*[mK]//g' test-output.log > test-output.clean.log
          if grep -Eiq "ERROR in|compiled with [1-9][0-9]* errors" test-output.clean.log; then
            echo "Found TypeScript or webpack compilation errors in test output"
            exit 1
          fi
        env:
          CI: true
